name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 문법 검사
        run: python -m compileall -q moim tools
      - name: 기능끼리 불러 쓰지 않는지 검사
        run: python tools/check_imports.py
      - name: 팀 테스트
        run: python -m unittest discover -s tests
